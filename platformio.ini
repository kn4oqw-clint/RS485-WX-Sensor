; ============================================================
; PlatformIO Configuration
; Target: STM32F411CEU6 (WeAct Black Pill V2.0)
; Framework: Arduino (STM32duino)
;
; Two environments:
;   blackpill_f411ce  — node firmware (src/main.cpp)
;   boardtest         — hardware bring-up test (src/board_test.cpp)
; ============================================================

[env]
platform = ststm32
board = blackpill_f411ce
framework = arduino

monitor_speed = 115200

; ST-Link/V2 is wired to the SWD header — no BOOT0 dance needed.
; Fall back to `dfu` (hold BOOT0, tap NRST, release) if the probe is
; not attached.
upload_protocol = stlink

build_unflags = -mfloat-abi=hard

build_flags =
    -D PIO_FRAMEWORK_ARDUINO_ENABLE_HW_SERIAL
    ; Serial1 (GPS, PA10/PA9) is already enabled by the variant, which sets
    ; SERIAL_UART_INSTANCE=1. Defining ENABLE_HWSERIAL1 here only warns.
    -D ENABLE_HWSERIAL2          ; hub uplink — Serial2 on PA2/PA3
    -O2
    -mfloat-abi=softfp
    -D USBCON
    -D USBD_USE_CDC

; ------------------------------------------------------------
; Node firmware
; ------------------------------------------------------------
[env:blackpill_f411ce]
build_src_filter = +<*> -<board_test.cpp> -<sensor_test.cpp>

build_flags =
    ${env.build_flags}
    -L ${PROJECT_DIR}/lib/BSEC
    -lalgobsec

lib_deps =
    lib/BSEC
    https://github.com/BoschSensortec/BME68x-Sensor-API

; ------------------------------------------------------------
; Board bring-up test — no libraries on purpose. When a probe fails
; you want to know it is the hardware, not somebody else's driver.
; ------------------------------------------------------------
[env:boardtest]
build_src_filter = +<board_test.cpp>

; ----------------------------------------------------------------
; BSEC Manual Library Setup (node firmware only)
; ----------------------------------------------------------------
; Bosch does not permit redistributing BSEC, so lib/BSEC is gitignored.
;
; 1. Download BSEC from:
;    https://www.bosch-sensortec.com/software-tools/software/bsec/
;
; 2. Locate: algo/normal_version/bin/STM32/STM32F4/libalgobsec.a
;    Headers: algo/normal_version/inc/bsec_datatypes.h
;                                      bsec_interface.h
;
; 3. Create in your project:
;    lib/BSEC/src/bsec_datatypes.h
;    lib/BSEC/src/bsec_interface.h
;    lib/BSEC/libalgobsec.a
;
; The prebuilt STM32F4 blob is softfp, which is why build_unflags drops
; -mfloat-abi=hard above. Mixing float ABIs will not link.
; ----------------------------------------------------------------

; ------------------------------------------------------------
; BME680 / BSEC validation — proves the compensation math produces
; believable numbers, which the dependency-free board test cannot.
; ------------------------------------------------------------
[env:sensortest]
build_src_filter = +<sensor_test.cpp>

build_flags =
    ${env.build_flags}
    -L ${PROJECT_DIR}/lib/BSEC
    -lalgobsec

lib_deps =
    lib/BSEC
    https://github.com/BoschSensortec/BME68x-Sensor-API
